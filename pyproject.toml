[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runecli"
version = "0.1.2"
description = "A terminal-first developer tool that turns a real GitHub issue into a grounded coding quest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "google-genai==2.28.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "questionary==2.1.1",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
rune = "rune.cli:app"

[project.urls]
Homepage = "https://github.com/khanirfan18/runeCLI"
Repository = "https://github.com/khanirfan18/runeCLI"
Issues = "https://github.com/khanirfan18/runeCLI/issues"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
    "/rune",
]
exclude = [
    "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["rune"]
